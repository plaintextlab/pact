name: Build

# Every push builds a debug APK and the desktop apps.
# Pushing a tag like v0.1.0 also builds a signed APK and publishes a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Always increasing, so each build can be installed over the previous one.
      PACT_VERSION_CODE: ${{ github.run_number }}
      PACT_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-dev.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and test
        run: |
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
          cp app/build/outputs/apk/debug/app-debug.apk pact-$PACT_VERSION_NAME-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pact-android-debug
          path: android/pact-*-debug.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PACT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PACT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PACT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64 etc.)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export PACT_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk pact-$PACT_VERSION_NAME.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE == 'true'
        with:
          name: pact-android-release
          path: android/pact-v*.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p pact-desktop
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/pact-${{ matrix.name }}.zip" ./target/release/pact.exe
          else
            tar -czf "dist/pact-${{ matrix.name }}.tar.gz" -C target/release pact
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pact-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Drop debug APK from the release
        run: rm -f dist/*-debug.apk && ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
