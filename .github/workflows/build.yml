name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pact-${{ github.run_number }}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pact-android-apk
          path: android/pact-*-debug.apk
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux, bin: pact }
          - { os: windows-latest, name: windows, bin: pact.exe }
          - { os: macos-latest, name: macos, bin: pact }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p pact-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: pact-desktop-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
